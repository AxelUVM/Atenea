<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atenea</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="encabezado-atenea">
      <img src="./assets/logo.png" alt="Logo Atenea" class="logo-atenea">

      <div class="textos-atenea">
        <h1>Atenea</h1>
        <p>Tu guía, a tu ritmo</p>
      </div>
    </header>
    <!-- Selector rápido de perfil -->
    <select id="perfil">
      <option value="Adulto mayor">Soy adulto mayor</option>
      <option value="Estudiante de primera generación">Soy estudiante</option>
      <option value="Persona migrante">Soy persona migrante</option>
    </select>

    <!-- Botón principal de Voz -->
    <button id="btnVoz">Toca y habla con Atenea en tu idioma</button>

    <!-- Opción alternativa de Texto -->
    <input type="text" id="inputTexto" placeholder="O escribe tu duda aquí...">
    <button id="btnTexto">Enviar pregunta</button>

    <!-- Estado y Resultados -->
    <p id="estado"></p>
    <div id="resultado" style="display: none">
      <h2 id="resTramite"></h2>
      <p id="resVoz"></p>
      <h3>Pasos a seguir:</h3>
      <ol id="resPasos"></ol>
      <h3>Documentos que necesitas:</h3>
      <ul id="resDocs"></ul>
      <a id="resLink" href="#" target="_blank">Ir al sitio oficial</a>
    </div>

    <script>
      const btnVoz = document.getElementById("btnVoz");
      const btnTexto = document.getElementById("btnTexto");
      const estado = document.getElementById("estado");
      let mediaRecorder;
      let audioChunks = [];
      let grabando = false;

      // 1. Lógica del botón de micrófono
      btnVoz.onclick = async () => {
        if (!grabando) {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: true,
          });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const blob = new Blob(audioChunks, { type: "audio/webm" });
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = () => {
              const base64 = reader.result.split(",")[1]; // Limpia el encabezado
              enviarADeno({ audioBase64: base64 });
            };
          };
          mediaRecorder.start();
          grabando = true;
          btnVoz.textContent = "Presiona para enviar audio";
          estado.textContent = "Escuchando...";
        } else {
          mediaRecorder.stop();
          grabando = false;
          btnVoz.textContent = "Presiona para hablar";
        }
      };

      // 2. Lógica del botón de texto
      btnTexto.onclick = () => {
        const texto = document.getElementById("inputTexto").value;
        if (texto) enviarADeno({ textoConsulta: texto });
      };

      // 3. Función que conecta el HTML con tu servidor Deno
      async function enviarADeno(datos) {
        estado.textContent = "Pensando en tu respuesta...";
        datos.perfil = { situacion: document.getElementById("perfil").value };

        const res = await fetch("/api/orientar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(datos),
        });

        const guia = await res.json();
        estado.textContent = "";
        mostrarResultado(guia);
      }

      // 4. Dibuja los datos en pantalla y los lee en voz alta
      function mostrarResultado(guia) {
        document.getElementById("resultado").style.display = "block";
        document.getElementById("resTramite").textContent = guia.tramite;
        document.getElementById("resVoz").textContent = guia.respuestaVoz;

        // Llenar listas
        document.getElementById("resPasos").innerHTML = guia.pasos.map((p) =>
          `<li>${p}</li>`
        ).join("");
        document.getElementById("resDocs").innerHTML = guia.documentos.map(
          (d) => `<li>${d}</li>`,
        ).join("");

        const link = document.getElementById("resLink");
        if (guia.enlaceOficial) {
          link.href = guia.enlaceOficial;
          link.style.display = "inline-block";
        } else {
          link.style.display = "none";
        }

        // Leer en voz alta usando la voz nativa del celular
        window.speechSynthesis.cancel();
        if (!guia.esLenguaOriginaria) {
          const lectura = new SpeechSynthesisUtterance(guia.respuestaVoz);
          if (guia.codigoIdioma) {
            lectura.lang = guia.codigoIdioma;
          }
          window.speechSynthesis.speak(lectura);
        }
      }
    </script>
  </body>
</html>
